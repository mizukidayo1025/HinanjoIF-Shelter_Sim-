name: デプロイナウ版のビルド

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build-deploy-now.yml

permissions:
  contents: read

env:
  SHELTERSIM_LLM_MODE: offline

jobs:
  site:
    name: 静的サイトを作る
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: build-deploy-now
      - name: Python と Rust の準備
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
          python -m pip install -e . "maturin>=1.7,<2"
          maturin build --locked --profile ci -m native/Cargo.toml --out "$RUNNER_TEMP/wheels"
          python -m pip install --no-index --find-links "$RUNNER_TEMP/wheels" sheltersim-native
      - name: ブラウザー向け WASM を作る
        run: |
          version=0.2.129
          archive=wasm-bindgen-$version-x86_64-unknown-linux-musl
          curl -fsSL -o "$RUNNER_TEMP/$archive.tar.gz" "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$version/$archive.tar.gz"
          echo "82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  $RUNNER_TEMP/$archive.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          cargo build --locked --manifest-path native/Cargo.toml -p sheltersim_wasm --target wasm32-unknown-unknown --release
          "$RUNNER_TEMP/$archive/wasm-bindgen" --target web --out-dir "$RUNNER_TEMP/wasm-web" \
            native/target/wasm32-unknown-unknown/release/sheltersim_wasm.wasm
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 江戸川区の例と全国の避難所データを入れる
        run: |
          npm install --prefix "$RUNNER_TEMP/build-tools" esbuild@0.27.3
          export PATH="$RUNNER_TEMP/build-tools/node_modules/.bin:$PATH"
          python scripts/build_project_sample.py "$RUNNER_TEMP/projects" --example sample-3 --bundles "$RUNNER_TEMP/samples"
          python scripts/build_static_site.py "$RUNNER_TEMP/site" --profile deploy-now \
            --pkg "$RUNNER_TEMP/wasm-web" --bundle "$RUNNER_TEMP/samples/sample-3.shelterproj" \
            --fetch-shelters > "$RUNNER_TEMP/site-build.json"
          cat "$RUNNER_TEMP/site-build.json"
          test "$(jq -r .commit "$RUNNER_TEMP/site/version.json")" = "$GITHUB_SHA"
          test "$(jq -r .modified "$RUNNER_TEMP/site/version.json")" = false
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-now-site
          path: ${{ runner.temp }}/site/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-now-build-info
          path: |
            ${{ runner.temp }}/site-build.json
            ${{ runner.temp }}/sample-build.json
          if-no-files-found: error
          retention-days: 30

  browser:
    name: 静的サイトを確認 (${{ matrix.browser }})
    needs: site
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            mode: full
          - browser: firefox
            mode: pieces
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: deploy-now-site
          path: ${{ runner.temp }}/site
      - name: Playwright を準備
        run: |
          python -m pip install "playwright==1.64.1"
          python -m playwright install --with-deps "${{ matrix.browser }}"
      - name: WASM・再生・シナリオ作成・分岐・レポートを確認
        run: |
          python scripts/serve_static_site.py "$RUNNER_TEMP/site" --port 8123 &
          server=$!
          trap 'kill "$server"' EXIT
          curl --fail --silent --show-error --retry 5 --retry-connrefused \
            http://127.0.0.1:8123/version.json
          python benchmarks/static_site_e2e.py --url http://127.0.0.1:8123 --deploy-now \
            --require-all --browsers "${{ matrix.browser }}" --modes "${{ matrix.mode }}" \
            --output "$RUNNER_TEMP/e2e.json"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: deploy-now-e2e-${{ matrix.browser }}
          path: ${{ runner.temp }}/e2e.json
          if-no-files-found: warn
          retention-days: 30
