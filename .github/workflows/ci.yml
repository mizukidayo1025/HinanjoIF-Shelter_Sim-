# The checks of every pull request to main, on Linux, Windows and macOS (#48); also run by hand.
# Each OS builds and installs the Rust kernels (native/) once, with the profile ci (#217), runs the
# tests with them and then checks the hashes of every path against the same fixture. Linux runs
# every test (one job since #477: the kernel took longer to build than the tests to run); Windows
# and macOS run the tests whose behaviour can depend on the OS (pytest --os-subset, #380), and
# 「全件の確認（手動・3つのOS）」 (long-regression.yml) runs the whole suite on each OS with a
# release build. Lint runs on Linux only, and beside it, each in a job of its own, the Rust core's
# tests and its checks without rayon and in WASM (#380). No job calls an LLM Provider:
# SHELTERSIM_LLM_MODE is offline. The workflow was named オフラインCI until 2026-11-15.
name: PRの確認

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer run on the same branch or PR replaces an older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SHELTERSIM_LLM_MODE: offline

jobs:
  test:
    name: ${{ matrix.title }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform and part reports, even when another fails.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, title: "テスト全件と計算結果（Linux）", select: "", label: "all" }
          # The bytes of a Run are the same on every OS (the hash step below), so Windows and
          # macOS keep tests/unit, tests/e2e and the tests marked os_dependent: files and locks,
          # processes, OS measurements (#380).
          - { os: windows-latest, title: "Windowsでの動作", select: "--os-subset", label: "os" }
          - { os: macos-latest, title: "macOSでの動作", select: "--os-subset", label: "os" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: packageと開発toolを導入
        run: python -m pip install -e ".[dev]"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      # The profile ci of native/Cargo.toml builds much sooner than release and gives the same
      # bytes (#217); long-regression.yml checks the release build by hand (#477).
      - name: Rustのkernelを作って導入
        id: native
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          python -m pip install "maturin>=1.7,<2"
          maturin build --profile ci -m native/Cargo.toml --out native-dist
          python -m pip install --no-index --find-links native-dist sheltersim-native
          python -c "import sheltersim.native"
      - name: 長いテストを除いて実行
        run: python -m pytest -m "not long_simulation" -n auto ${{ matrix.select }}
      # The same expected hashes on every OS (step 4, L13): a Run gives the same bytes on each.
      # Runs even when a test failed, so both report.
      - name: 全経路のハッシュを確認
        id: gate
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        shell: bash
        run: python benchmarks/gate_all_paths.py --output "$RUNNER_TEMP/gate" --expect fixtures/gate-all-paths.json
      - name: test結果を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.label }}
          path: .test-results/
          retention-days: 7
          if-no-files-found: ignore
          # .test-results is a dot directory, which upload-artifact skips by default.
          include-hidden-files: true
      - name: 全経路のハッシュを保存
        if: ${{ !cancelled() && steps.gate.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ matrix.os }}
          path: ${{ runner.temp }}/gate/summary.json
          retention-days: 7
          if-no-files-found: ignore

  lint:
    name: 書式・規則
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: packageと開発toolを導入
        run: python -m pip install -e ".[dev]"
      - name: lintを確認
        run: ruff check .
      - name: formatを確認
        run: ruff format --check .
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: clippy
      # The bans of native/clippy.toml hold in the tests too (--all-targets, #390): a test's expected
      # value made with f64::max would part from the rule's py_max at a tie or a NaN.
      - name: Rustの禁止メソッドを確認
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          cargo clippy --manifest-path native/Cargo.toml --workspace --all-targets -- -A clippy::all -D clippy::disallowed_methods
      # native/rustfmt.toml sets the style of every crate in the workspace (#367).
      - name: Rustのformatを確認
        run: cargo fmt --manifest-path native/Cargo.toml --all -- --check

  # The Rust core's own tests, in a job of their own beside the lint (#380).
  core_tests:
    name: Rustの計算部分のテスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: core-tests
      - name: Rustのtoolchainを導入
        run: rustup toolchain install stable --profile minimal
      # The core crate builds without Python (#152): no pyo3 in its tree, and its own tests pass.
      # The tests build with the profile ci-test of native/Cargo.toml: dev's checks at opt-level 1,
      # so the simulations in them run several times sooner (#380).
      - name: Rustの中核がPyO3なしで動くことを確認
        run: |
          if cargo tree --manifest-path native/Cargo.toml -p sheltersim_core -e normal,build | grep -q pyo3; then
            echo "sheltersim_core depends on pyo3" >&2
            exit 1
          fi
          cargo test --manifest-path native/Cargo.toml -p sheltersim_core --profile ci-test
      # The files of a stored Run on a disk (native/store, #426): the browser's stored Runs and
      # records written again byte for byte, locks, the limit, lines cut short.
      - name: 保存したRunのファイルの置き場のテスト
        run: cargo test --manifest-path native/Cargo.toml -p sheltersim_store --profile ci-test

  # The core without rayon, for the browser: a job of its own beside the core's tests, as each
  # builds them with other features (#380).
  core_single_thread:
    name: ブラウザー版の計算
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: single-thread
      - name: Rustのtoolchainを導入
        run: rustup toolchain install stable --profile minimal
      # Without the feature `parallel` (rayon) the core runs on the calling thread with the same
      # bytes and builds for the browser (#152, P10-1a). tests/no_platform.rs, run in both, finds
      # any std::time, fs, env or thread in its source.
      - name: Rustの中核がwasm32向けに作れ、1つのthreadで同じ結果になることを確認
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --manifest-path native/Cargo.toml -p sheltersim_core --target wasm32-unknown-unknown --no-default-features
          cargo test --manifest-path native/Cargo.toml -p sheltersim_core --profile ci-test --no-default-features
      # The core runs in WASM through wasm-bindgen and reaches the native path's digests (#244,
      # PR 4-4): the CLI's version must be the crate's (`native/wasm/Cargo.toml`), and the release
      # archive is checked against its sha256.
      - name: Rustの中核がWASMでネイティブと同じdigestになることを確認
        run: |
          version=0.2.129
          archive=wasm-bindgen-$version-x86_64-unknown-linux-musl
          curl -sSfL -o "$RUNNER_TEMP/$archive.tar.gz" "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$version/$archive.tar.gz"
          echo "82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  $RUNNER_TEMP/$archive.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          cargo build --manifest-path native/Cargo.toml -p sheltersim_wasm --target wasm32-unknown-unknown --profile ci
          "$RUNNER_TEMP/$archive/wasm-bindgen" --target nodejs --out-dir "$RUNNER_TEMP/pkg" native/target/wasm32-unknown-unknown/ci/sheltersim_wasm.wasm
          node native/wasm/tests/node_digests.mjs "$RUNNER_TEMP/pkg"
          node native/wasm/tests/node_frames.mjs "$RUNNER_TEMP/pkg"
          node native/wasm/tests/node_saved_points.mjs "$RUNNER_TEMP/pkg"
          node native/wasm/tests/node_project_store.mjs "$RUNNER_TEMP/pkg"
          node native/wasm/tests/node_api_answers.mjs "$RUNNER_TEMP/pkg"
          node native/wasm/tests/node_browser_api.mjs "$RUNNER_TEMP/pkg"
          node native/wasm/tests/node_compute.mjs "$RUNNER_TEMP/pkg"
          node native/wasm/tests/node_interpret.mjs "$RUNNER_TEMP/pkg"
          node native/wasm/tests/node_interventions.mjs "$RUNNER_TEMP/pkg"
          node native/wasm/tests/node_summaries.mjs "$RUNNER_TEMP/pkg"
          node native/wasm/tests/node_scenarios.mjs "$RUNNER_TEMP/pkg"
          node native/wasm/tests/node_research.mjs "$RUNNER_TEMP/pkg"
          node native/wasm/tests/node_scenario_text.mjs "$RUNNER_TEMP/pkg"
          node native/wasm/tests/node_scenario_routes.mjs "$RUNNER_TEMP/pkg"
          node native/wasm/tests/node_scenario_llm.mjs "$RUNNER_TEMP/pkg"
          node native/wasm/tests/node_programs.mjs "$RUNNER_TEMP/pkg"
          node native/wasm/tests/node_initial.mjs "$RUNNER_TEMP/pkg"
          node native/wasm/tests/node_stored_runs.mjs "$RUNNER_TEMP/pkg"
