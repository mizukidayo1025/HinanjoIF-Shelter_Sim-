# ブラウザー版の静的サイトを作り、Cloudflare Workersの静的なファイルの配信へ公開する（#289）。
# 手で起動する（書き込み権限のある人なら誰でも）。公開するのはmainだけで、dry_runは
# どのbranchでもサイトを作ってwranglerの--dry-runまで行い、Cloudflareには何も送らない。
# 公開の後に、道ごとの答えと、ChromiumとFirefoxでの画面（static_site_e2e.py --url）を確かめる。
# 公開した回だけ、GitHubのDeployments（環境browser）にcommitを記録する（#563）。
# kernelとWASMを別のjobで並べて作り、画面の確かめもブラウザーごとのjobで並べる（#415）。
# 手順と設定はdocs/development.mdの「ブラウザー版の公開」。
name: ブラウザー版の公開

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: サイトを作ってwranglerの--dry-runまで（Cloudflareに送らない）
        type: boolean
        default: false

permissions:
  contents: read

# One deployment at a time; a newer one waits instead of cancelling a deployment half done.
concurrency:
  group: deploy-browser
  cancel-in-progress: false

env:
  SHELTERSIM_LLM_MODE: offline
  WRANGLER: wrangler@4.161.0
  SITE_URL: https://hinanjo-if.water7.workers.dev

jobs:
  gate:
    name: 公開できる条件か確認
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 公開できる条件か確認
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$DRY_RUN" = true ]; then exit 0; fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::only main is published ($GITHUB_REF); use dry_run on other branches"
            exit 1
          fi
          if [ "$HAS_TOKEN" != true ] || [ "$HAS_ACCOUNT" != true ]; then
            echo "::error::the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set"
            exit 1
          fi

  # The examples come from Python (scripts/build_project_sample.py --bundles, #427), which
  # needs the native kernel; the profile ci gives the same bytes as release (#217).
  kernel:
    name: Rustのkernelを作る
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: deploy-browser-kernel
      - name: Rustのkernelを作る
        run: |
          rustup toolchain install stable --profile minimal
          python -m pip install "maturin>=1.7,<2"
          maturin build --profile ci -m native/Cargo.toml --out native-dist
      - uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: native-dist/
          retention-days: 1

  # The same wasm-bindgen as the lint job of ci.yml (the crate's version, checked by sha256).
  wasm:
    name: WASMを作る
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: deploy-browser-wasm
      - name: WASMを作る
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
          version=0.2.129
          archive=wasm-bindgen-$version-x86_64-unknown-linux-musl
          curl -sSfL -o "$RUNNER_TEMP/$archive.tar.gz" "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$version/$archive.tar.gz"
          echo "82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  $RUNNER_TEMP/$archive.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          cargo build --manifest-path native/Cargo.toml -p sheltersim_wasm --target wasm32-unknown-unknown --release
          wasm=native/target/wasm32-unknown-unknown/release/sheltersim_wasm.wasm
          "$RUNNER_TEMP/$archive/wasm-bindgen" --target nodejs --out-dir wasm/pkg "$wasm"
          "$RUNNER_TEMP/$archive/wasm-bindgen" --target web --out-dir wasm/web "$wasm"
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: wasm/
          retention-days: 1

  # A publish is recorded as a deployment of the environment `browser` (#563): the repository's
  # Deployments then say which commit the site is. A dry run names no environment and records none.
  site:
    name: サイトを作って公開
    needs: [kernel, wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ !inputs.dry_run && 'browser' || '' }}
      url: ${{ !inputs.dry_run && env.SITE_URL || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: kernel
          path: native-dist
      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: ${{ runner.temp }}/wasm
      - name: packageとkernelを導入
        run: |
          python -m pip install -e .
          python -m pip install --no-index --find-links native-dist sheltersim-native
          python -c "import sheltersim.native"
      - name: 例のRunを作る
        run: python scripts/build_project_sample.py "$RUNNER_TEMP/sample-projects" --bundles "$RUNNER_TEMP/samples"
      # The site is generated outside the repository (scripts/build_static_site.py refuses inside).
      - name: サイトを組み立てる
        run: |
          python scripts/build_static_site.py "$RUNNER_TEMP/site" --pkg "$RUNNER_TEMP/wasm/web" \
            --bundle "$RUNNER_TEMP/samples/sample.shelterproj" \
            --bundle "$RUNNER_TEMP/samples/sample-2.shelterproj" \
            --bundle "$RUNNER_TEMP/samples/sample-3.shelterproj" \
            --fetch-shelters > "$RUNNER_TEMP/site-build.json"
          cat "$RUNNER_TEMP/site-build.json"
          # The site says it is this commit, with no tracked file changed (/version.json, #563).
          python - "$RUNNER_TEMP/site/version.json" "$GITHUB_SHA" <<'PY'
          import json, sys
          version = json.load(open(sys.argv[1]))
          if (version["commit"], version["modified"]) != (sys.argv[2], False):
              sys.exit(f"::error::the site says {version}, not the commit {sys.argv[2]}")
          PY
      - name: wranglerで確かめる（送らない）
        run: npx --yes "$WRANGLER" deploy --config deploy/workers/wrangler.jsonc --assets "$RUNNER_TEMP/site" --dry-run
      - name: 公開する
        if: ${{ !inputs.dry_run }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes "$WRANGLER" deploy --config deploy/workers/wrangler.jsonc --assets "$RUNNER_TEMP/site" \
            --tag "${GITHUB_SHA::12}" --message "main ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"
      # Each path answers as docs/development.md says, and the shelter index (which holds the time
      # the site was built) is this build's, so the checks after it see the new version.
      - name: 公開した道の答えを確かめる
        if: ${{ !inputs.dry_run }}
        run: |
          fail=0
          check() {
            got=$(curl -s -o /dev/null -w "%{http_code} %{content_type} %{redirect_url}" "$SITE_URL$1")
            echo "$1 -> $got"
            case "$got" in "$2"*) ;; *) echo "::error::$1: expected $2, got $got"; fail=1 ;; esac
          }
          index=browser/gsi-shelter-index.json
          want=$(sha256sum "$RUNNER_TEMP/site/$index" | cut -d' ' -f1)
          for attempt in $(seq 1 30); do
            got=$(curl -s "$SITE_URL/$index" | sha256sum | cut -d' ' -f1)
            [ "$got" = "$want" ] && break
            sleep 10
          done
          if [ "$got" != "$want" ]; then echo "::error::$SITE_URL/$index is not this build's"; fail=1; fi
          # The published site says it is this commit (#563). It is waited for as the index is (at
          # most 5 minutes): on the first publish with it, /version.json answered 404 once after the
          # index was already this build's.
          for attempt in $(seq 1 30); do
            served=$(curl -s "$SITE_URL/version.json" | python -c 'import json, sys; print(json.load(sys.stdin)["commit"])' 2>/dev/null || true)
            [ "$served" = "$GITHUB_SHA" ] && break
            sleep 10
          done
          echo "/version.json commit -> $served (attempt $attempt)"
          if [ "$served" != "$GITHUB_SHA" ]; then echo "::error::$SITE_URL/version.json says $served, not $GITHUB_SHA"; fail=1; fi
          check /version.json "200 application/json"
          check / "200 text/html"
          check /nope "404 text/html"
          check /browser/api_worker.mjs "200 text/javascript"
          check /browser/pkg/sheltersim_wasm_bg.wasm "200 application/wasm"
          check /sample/sample.json "200 application/json"
          check /sample/sample-3.json "200 application/json"
          rows=("$RUNNER_TEMP"/site/browser/gsi-shelters/*.json)
          check "/browser/gsi-shelters/${rows[0]##*/}" "200 application/json"
          # The LLM relay (#419) answers its own paths: a session without a passphrase is refused.
          got=$(curl -s -o /dev/null -w "%{http_code} %{content_type}" -X POST "$SITE_URL/llm/v1/session")
          echo "POST /llm/v1/session -> $got"
          case "$got" in "401 application/json"*) ;; *) echo "::error::POST /llm/v1/session: expected 401 application/json, got $got"; fail=1 ;; esac
          # The relay's owner page (#433), at the path the build says (build_static_site.py's
          # ADMIN_PAGE), and its routes refusing a request without the owner's key (503 until the
          # secret LLM_ADMIN_KEY is set).
          admin=$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["admin_page"])' "$RUNNER_TEMP/site-build.json")
          check "$admin" "200 text/html"
          got=$(curl -s -o /dev/null -w "%{http_code} %{content_type}" -X POST "$SITE_URL/llm/v1/admin/recipients")
          echo "POST /llm/v1/admin/recipients -> $got"
          case "$got" in "401 application/json"* | "503 application/json"*) ;; *) echo "::error::POST /llm/v1/admin/recipients: expected 401 or 503 JSON, got $got"; fail=1 ;; esac
          exit $fail
      - name: 結果を保存
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: deploy-browser-site
          path: ${{ runner.temp }}/site-build.json
          retention-days: 30
          if-no-files-found: ignore

  # Each browser walks the published site in its own job, at the same time: Chromium computes the
  # Run at once (full), Firefox in pieces (static_site_e2e.py's --modes). Playwright is not a
  # dependency of the project (docs/development.md); the version is the one the checks were
  # written with.
  screen:
    name: 公開したサイトを画面で確かめる（${{ matrix.browser }}）
    needs: site
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            mode: full
          - browser: firefox
            mode: pieces
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Playwrightを導入
        run: |
          python -m pip install "playwright==1.64.1"
          python -m playwright install --with-deps "${{ matrix.browser }}"
      - name: 画面で確かめる
        run: |
          python benchmarks/static_site_e2e.py --url "$SITE_URL" \
            --browsers "${{ matrix.browser }}" --modes "${{ matrix.mode }}" \
            --output "$RUNNER_TEMP/e2e-url.json" --screenshots "$RUNNER_TEMP/e2e-url-shots"
      - name: 結果を保存
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: deploy-browser-screen-${{ matrix.browser }}
          path: |
            ${{ runner.temp }}/e2e-url.json
            ${{ runner.temp }}/e2e-url-shots/
          retention-days: 30
          if-no-files-found: ignore
