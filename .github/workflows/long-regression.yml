# 手で起動する、長いテストまたは全件の確認。「PRの確認」（ci.yml）と同じく、Linux・Windows・macOSの
# 3つでRustのkernel（native/）を作って導入してから実行する。固定のハッシュは3つのOSで同じ（L13）。
# 「PRの確認」はWindowsとmacOSでOSの差が出るテストだけを実行するので、審査に出す前や公開の前などに
# fullで3つのOSの全件を確かめる（#380）。LLMのProviderは呼ばない（SHELTERSIM_LLM_MODE=offline）。
# 2026-11-15までの名前は「長時間simulation回帰」。
name: 全件の確認（手動・3つのOS）

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 長いテストだけ（long）か、全件（full）か
        required: true
        type: choice
        default: full
        options:
          - long
          - full

permissions:
  contents: read

jobs:
  long_simulation:
    name: 長いテスト（${{ matrix.os }}）
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'long' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      SHELTERSIM_LLM_MODE: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: packageと開発toolを導入
        run: python -m pip install -e ".[dev]"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Rustのkernelを作って導入
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          python -m pip install "maturin>=1.7,<2"
          maturin build --release -m native/Cargo.toml --out native-dist
          python -m pip install --no-index --find-links native-dist sheltersim-native
          python -c "import sheltersim.native"
      - name: 長いテストを実行
        run: python -m pytest -m long_simulation

  full_release_regression:
    name: 全件（${{ matrix.os }}）
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'full' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      SHELTERSIM_LLM_MODE: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: packageと開発toolを導入
        run: python -m pip install -e ".[dev]"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Rustのkernelを作って導入
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          python -m pip install "maturin>=1.7,<2"
          maturin build --release -m native/Cargo.toml --out native-dist
          python -m pip install --no-index --find-links native-dist sheltersim-native
          python -c "import sheltersim.native"
      - name: 全件を実行
        run: python -m pytest
