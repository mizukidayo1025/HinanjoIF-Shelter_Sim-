[package]
name = "sheltersim_native"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[lib]
name = "sheltersim_native"
crate-type = ["cdylib"]

[workspace]
members = [".", "core", "store", "wasm"]

[workspace.lints.clippy]
# A loop over a HashMap or HashSet goes in an order that changes from process to process. Each one
# left is allowed where it is, with why its order reaches no result (docs/rust-port/step4-plan.md 9).
iter_over_hash_type = "deny"

[dependencies]
# The local and VM versions run the core with its helper threads: its default feature `parallel`,
# named here so that the wrapper keeps it whatever the core's defaults become.
sheltersim_core = { path = "core", features = ["parallel"] }
# The files of a stored Run on a disk (#426), for `rules::run_files`.
sheltersim_store = { path = "store" }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py312"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }

[lints]
workspace = true

[profile.release]
lto = true
codegen-units = 1

# The test jobs of 「PRの確認」 (ci.yml) build with this profile (Issue #217): the same
# optimization level as release, but thin LTO and 16 codegen units, so the two crates of the
# workspace build much sooner, and the tests take as long as with release. The bytes of a Run do
# not depend on it (the hashes of every path are the same). The job 「計算結果が変わっていないか」
# of ci.yml, long-regression.yml, deploy/vm and the build in docs/development.md keep --release.
[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16

# The jobs 「Rustの計算部分のテスト」 and 「ブラウザー版の計算」 of ci.yml run the core's
# `cargo test` with this profile (Issue #380): dev's checks (overflow, debug_assert) at opt-level
# 1, without debug info, so the simulations in the tests run several times sooner for a little
# more build time. Each file of native/core/tests is a binary of its own, so an LTO profile (ci,
# release) would link the core into each again.
[profile.ci-test]
inherits = "dev"
opt-level = 1
debug = false
