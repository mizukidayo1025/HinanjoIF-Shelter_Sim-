[package]
name = "sheltersim_store"
version = "0.1.0"
edition = "2021"
publish = false
# The tests are one binary, tests/main.rs, as the core's (#388).
autotests = false
description = "The files of a stored Run of 避難所IF！ on a disk (Issue #426): the core's format v5 (`sheltersim_core::run_store`) written and read with file I/O, deflate-raw, locks and a quota. Not part of the WASM build."

[lib]
crate-type = ["rlib"]

[[test]]
name = "store"
path = "tests/main.rs"

[dependencies]
# The core without its default feature `parallel`: whoever builds this crate with the core (the
# PyO3 wrapper) names the core's features itself, and a Run gives the same bytes either way.
sheltersim_core = { path = "../core", default-features = false }
# deflate-raw, as the browser's CompressionStream("deflate-raw") writes it (in pure Rust: the
# miniz_oxide backend). Its bytes may differ from zlib's; what they hold may not (#414).
flate2 = "1"
serde_json = { version = "1.0", features = ["arbitrary_precision"] }

[lints]
workspace = true
